<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Percere AI — LinkedIn Page cover</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        background: #04070d;
      }

      /* Laid out at 6:1 and rendered at a high device scale factor, because
         LinkedIn Pages want a 4200x700 upload and only display it at 1128x191.
         The scene deliberately leaves its left fifth empty: that is where
         LinkedIn overlays the company logo tile. */
      .banner {
        position: relative;
        width: 1128px;
        height: 188px;
        overflow: hidden;
        background: #04070d;
        font-family: "Helvetica Neue", "SF Pro Display", -apple-system, Arial, sans-serif;
      }

      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 50% 50%;
      }

      .scrim-bottom {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          0deg,
          rgba(4, 7, 13, 0.8) 0%,
          rgba(4, 7, 13, 0.3) 16%,
          rgba(4, 7, 13, 0) 34%
        );
      }

      .strapline {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 13px;
        text-align: center;
        font-size: 17px;
        font-weight: 300;
        letter-spacing: 0.04em;
        color: #dceaf4;
        white-space: nowrap;
        text-shadow: 0 2px 16px rgba(4, 7, 13, 1), 0 0 30px rgba(4, 7, 13, 0.95);
      }

      .strapline b {
        font-weight: 700;
        color: #ffffff;
      }
    </style>
  </head>
  <body>
    <div class="banner">
      <img class="scene" src="banner-strip.png" alt="" />
      <div class="scrim-bottom"></div>

      <div class="strapline">
        Ultimate <b>Per</b>ception. &nbsp;Unified <b>Cere</b>brum.
      </div>
    </div>
  </body>
</html>
